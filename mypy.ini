# mypy configuration for this repository.
#
# SCOPE. Only sim/world/ is checked. Those nine modules are the most
# self-contained part of the codebase (domain physics with real physical
# quantities, no sim/engine/ dependency by design - see sim/world/__init__.py)
# and the first package getting type annotations; nothing else in the
# repository has any yet, and pointing mypy at sim/engine/ or sim/tests/
# today would report thousands of findings nobody asked it to fix.
#
# STARTING PERMISSIVE, ON PURPOSE. This section is deliberately not strict
# mode and does not require annotations everywhere. Only the modules under
# sim/world/ that have actually been annotated should pass clean; the rest of
# the repository is untouched, unannotated code that mypy should not be
# asked to judge yet. A configuration nobody can satisfy gets deleted by the
# next person to look at it (see CLAUDE.md SS5's own instruction to that
# effect) - so this file asks for what sim/world/'s current annotations
# actually deliver, not for an aspirational strict mode the rest of the
# package cannot yet meet. Tighten it (enable disallow_untyped_defs,
# disallow_any_generics, etc.) only once the modules being checked actually
# satisfy the stricter setting.
#
# THE TWO-IMPORT-ROOTS SITUATION (see sim/constants.py lines 124-150 for the
# full story). sim/world/ modules import `sim.constants` and
# `sim.world.shared_constants` fully qualified, rooted at the REPOSITORY,
# not at sim/ itself - the same rooting sim/tests/ and this file's own
# `mypy_path` below use. mypy_path adds the repository root to the module
# search path (equivalent to PYTHONPATH) so `sim.constants` resolves the same
# way a real run rooted at the repository resolves it; explicit_package_bases
# additionally tells mypy to infer each file's fully qualified module name
# from the nearest directory WITHOUT an __init__.py (the repository root has
# none - see sim/constants.py's own note that this project intentionally has
# no sim/__init__.py) rather than guessing, which is what a plain run
# reported as "Source file found twice under different module names:
# 'world.shared_constants' and 'sim.world.shared_constants'" before this file
# existed. Nothing here restructures an import to please the tool, per the
# task's own instruction - this only tells mypy how the repository already
# resolves imports at runtime.

[mypy]
mypy_path = .
explicit_package_bases = True
python_version = 3.11
files = sim/world/

# Permissive baseline. Functions this pass has not yet annotated are left
# alone rather than flagged, so an unannotated helper elsewhere in the
# package (or in a module this pass has not reached) does not turn into mypy
# noise unrelated to the annotations actually being reviewed.
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# sim.constants's REGISTRY dict is stashed in sys.modules under a synthetic
# module name at runtime (see that file's own ONE REGISTRY, HOWEVER MANY
# TIMES THIS FILE IS LOADED section) specifically so every import root shares
# one object; mypy has no way to see that dynamic assignment and reports
# `Module has no attribute "REGISTRY"` at its one read site
# (sim/constants.py:148) as a false positive. Ignored here rather than
# "fixed" by restructuring a mechanism that exists to solve a real,
# previously-debugged problem (see that file's own comment and
# sim/tests/test_constants_burndown.py).
[mypy-sim.constants]
disable_error_code = attr-defined
